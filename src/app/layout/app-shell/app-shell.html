<a class="shell__skip-link" href="#main-content">Skip to main content</a>

<div class="shell">
	<header class="shell__header">
		<mat-toolbar class="shell__toolbar" role="banner">
			<div class="shell__branding">
				<a class="shell__brand" routerLink="/">AWS AI Revision</a>
				<span class="shell__subtitle" aria-label="AIF-C01 study app">
					AIF-C01 study app
				</span>
			</div>
		</mat-toolbar>
	</header>

	<div class="shell__layout">
		<aside class="shell__rail" aria-label="Primary navigation">
			<nav class="shell__rail-nav">
				@for (item of navigationItems; track item.path) {
					<a
						class="shell__rail-link"
						[routerLink]="item.path"
						routerLinkActive="shell__rail-link--active"
						[routerLinkActiveOptions]="{ exact: item.exact ?? false }"
						#desktopLink="routerLinkActive"
						[attr.aria-current]="desktopLink.isActive ? 'page' : null"
					>
						<mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
						<span>{{ item.label }}</span>
					</a>
				}
			</nav>
		</aside>

		<main id="main-content" class="shell__main" tabindex="-1">
			<div class="shell__content">
				<router-outlet />
			</div>
		</main>
	</div>

	<nav class="shell__bottom-nav" aria-label="Primary navigation">
		@for (item of navigationItems; track item.path) {
			<a
				class="shell__bottom-link"
				[routerLink]="item.path"
				routerLinkActive="shell__bottom-link--active"
				[routerLinkActiveOptions]="{ exact: item.exact ?? false }"
				#mobileLink="routerLinkActive"
				[attr.aria-current]="mobileLink.isActive ? 'page' : null"
			>
				<mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
				<span>{{ item.label }}</span>
			</a>
		}
	</nav>
</div>
